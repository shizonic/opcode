name: Build Windows

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          # ARM64 support can be added later
          # - target: aarch64-pc-windows-msvc
          #   arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        env:
          CI: true
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Create artifacts directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows-${{ matrix.arch }}"

          # Copy MSI installer if it exists
          $msiPath = "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi"
          if (Test-Path $msiPath) {
            Copy-Item $msiPath "dist/windows-${{ matrix.arch }}/"
          }

          # Copy NSIS installer if it exists
          $nsisPath = "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          if (Test-Path $nsisPath) {
            Copy-Item $nsisPath "dist/windows-${{ matrix.arch }}/"
          }

          # Generate checksums
          Get-ChildItem "dist/windows-${{ matrix.arch }}" -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Out-File -FilePath "dist/windows-${{ matrix.arch }}/checksums.txt" -Append
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/windows-${{ matrix.arch }}/*
          retention-days: 7